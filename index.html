<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQ Nail Art</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pearl:#F4F2FA; --card:#FFFFFF; --ink:#1C1530; --muted:#6E6785; --line:#E3DEF0;
  --gloss:#D91E48; --gloss-d:#A8123A; --lilac:#CFC2F7; --lilac-s:#ECE7FC; --mint:#1F9D72; --mint-s:#DDF3EA; --amber:#B7791F; --amber-s:#FBEFD5;
  --r-lg:26px; --r-md:16px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --deep:#1C1530;
}
[data-theme=dark]{--pearl:#130E21;--card:#1E1631;--ink:#F1EDFB;--muted:#A59DC2;--line:#322849;--lilac-s:#2D2350;--mint:#3CCB9A;--mint-s:#15372D;--amber:#E3A94C;--amber-s:#3A2D14;--deep:#2A1F47;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Figtree',system-ui,sans-serif;background:var(--pearl);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.5;padding:env(safe-area-inset-top,0px) 0 calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.wrap{max-width:480px;margin:0 auto;padding:0 18px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:14px 14px 14px 4px;background:var(--deep);color:#fff;display:grid;place-items:center;font:800 15px 'Bricolage Grotesque';letter-spacing:0}
.brand b{font:700 17px 'Bricolage Grotesque';display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}

/* Buttons: glossy polish */
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;font:600 14px 'Figtree';padding:13px 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--ease),box-shadow .18s var(--ease);min-height:46px}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.btn-gloss{color:#fff;background:linear-gradient(180deg,#EE3A62,var(--gloss) 55%,var(--gloss-d));box-shadow:0 8px 18px -6px rgba(217,30,72,.55),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn-gloss::after{content:"";position:absolute;top:4px;left:14%;width:46%;height:34%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));transform:rotate(-4deg)}
.btn-gloss:hover::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);animation:sheen .8s var(--ease)}
.btn-ink{background:var(--deep);color:#fff}
.btn-soft{background:var(--lilac-s);color:var(--ink)}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;min-height:38px;font-size:13px}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* Hero */
.hero{position:relative;background:var(--deep);color:#fff;border-radius:var(--r-lg);padding:24px 22px 22px;overflow:hidden;animation:rise .7s var(--ease) both}
.hero p.l{color:var(--lilac);font-size:13px;font-weight:600}
.hero .big{font:800 40px/1.05 'Bricolage Grotesque';letter-spacing:-.03em;margin:6px 0 4px}
.hero .sub{color:#B9B2D1;font-size:13px}
.drop{position:absolute;right:-28px;top:-34px;width:150px;height:150px;border-radius:50% 50% 50% 8%;transform:rotate(-30deg);background:linear-gradient(160deg,#F25577,var(--gloss) 60%,var(--gloss-d));opacity:.95;animation:float 5s ease-in-out infinite}
.drop::after{content:"";position:absolute;top:16%;left:22%;width:26%;height:38%;border-radius:999px;background:rgba(255,255,255,.45);transform:rotate(18deg)}
@keyframes float{50%{transform:rotate(-30deg) translateY(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Cards & stats */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat span{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.stat b{font:700 22px 'Bricolage Grotesque';display:block;margin-top:4px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec h2{font-size:20px}
.sec a{color:var(--gloss);font-weight:600;font-size:13px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;animation:pop .35s var(--ease) both}
.ava{width:42px;height:42px;border-radius:50%;background:var(--lilac-s);color:var(--ink);display:grid;place-items:center;font:700 15px 'Bricolage Grotesque';flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px}
.price{font:700 14px 'Bricolage Grotesque';white-space:nowrap}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--mint-s);color:var(--mint)}
.badge.warn{background:var(--amber-s);color:var(--amber)}
.badge.bad{background:#FBDDE4;color:var(--gloss-d)}
.badge.info{background:var(--lilac-s);color:var(--ink)}
.row.wr{flex-wrap:wrap}
.acts{display:flex;gap:8px;width:100%;flex-wrap:wrap;padding-top:10px;margin-top:2px;border-top:1px dashed var(--line)}
.acts .btn{flex:1;min-width:90px;text-decoration:none}
.btn-wa{background:#25D366;color:#073B1C}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip:disabled small{color:var(--gloss)}
.empty{text-align:center;padding:34px 20px;border:1.5px dashed var(--lilac);border-radius:var(--r-md);color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.empty .btn{margin-top:14px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.pagetitle{font-size:26px;margin:6px 0 14px}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv.total{font:700 17px 'Bricolage Grotesque'}

/* Floating tab bar */
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:30;pointer-events:none}
.dock nav{pointer-events:auto;display:flex;gap:4px;background:var(--deep);padding:6px;border-radius:999px;box-shadow:0 14px 34px -10px rgba(28,21,48,.6)}
.tab{border:0;background:none;color:#A39BC0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;font:600 13px 'Figtree';transition:all .25s var(--ease)}
.tab span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .3s var(--ease)}
.tab.on{background:var(--lilac);color:#1C1530}
.tab.on span{max-width:80px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(28,21,48,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s var(--ease);max-width:480px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;cursor:pointer;background:var(--pearl);border-radius:var(--r-md);padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font:600 12px 'Figtree';color:var(--ink);transition:transform .18s var(--ease),background .18s}
.tile:active{transform:scale(.94)}
.tile .ic{width:44px;height:44px;border-radius:14px 14px 14px 4px;display:grid;place-items:center;background:var(--lilac-s)}
.tile:nth-child(3n+2) .ic{background:var(--mint-s);color:var(--mint)}
.tile:nth-child(3n) .ic{background:var(--amber-s);color:var(--amber)}

/* Customer form */
.field{margin-top:18px}
.field>label{display:block;font:700 15px 'Bricolage Grotesque';margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font:600 13px 'Figtree';color:var(--ink);transition:all .2s var(--ease);text-align:left}
.chip small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.chip.on{border-color:var(--deep);background:var(--deep);color:#fff}
.chip.on small{color:var(--lilac)}
.chips.stack{flex-direction:column}.chips.stack .chip{width:100%;display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;font:500 15px 'Figtree';color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:48px;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--ink)}
.acct{display:flex;align-items:center;gap:12px}
.bar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin-top:22px;background:var(--deep);color:#fff;border-radius:22px;padding:12px 12px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 14px 30px -12px rgba(28,21,48,.6)}
.bar small{color:#B9B2D1;display:block;font-size:12px}
.bar b{font:700 19px 'Bricolage Grotesque'}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;background:rgba(28,21,48,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.modal .box{width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .4s var(--ease)}
.modal.on .box{transform:none}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--mint);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:80;transition:transform .45s var(--ease);max-width:90%;display:flex;gap:8px;align-items:center}
.toast.on{transform:translate(-50%,0)}
.view{animation:pop .4s var(--ease) both}
.still .row{animation:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.skel{border-radius:var(--r-md);background:linear-gradient(90deg,var(--line) 25%,var(--lilac-s) 50%,var(--line) 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--lilac-s);border-radius:999px;padding:4px;margin-top:14px}
.seg button{border:0;background:none;padding:11px;border-radius:999px;font:600 14px 'Figtree';color:var(--muted);cursor:pointer;transition:all .25s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(28,21,48,.12)}
.err{color:var(--gloss);font-size:12px;font-weight:600;margin-top:6px}
.err:empty{display:none}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:42px}
.done{text-align:center;padding-top:22px}
.ring{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--mint-s);color:var(--mint);animation:pop .5s var(--ease) both}
.ring.wait{background:var(--amber-s);color:var(--amber)}
.ring svg{width:38px;height:38px;stroke-width:2.2}
.done .card{text-align:left;margin:18px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chips.scroll .chip{white-space:nowrap}
.ibtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--lilac-s);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.demo{background:var(--amber-s);color:var(--amber);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:600;margin-bottom:12px}
.demo code{font-family:inherit;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark">AQ</div><div><b>AQ Nail Art</b><small id="topSub">Panel studio</small></div></div>
    <div style="display:flex;gap:8px"><button class="btn btn-soft btn-sm" id="themeBtn" onclick="toggleTheme()" aria-label="Ganti tema" style="padding:9px 12px"></button><button class="btn btn-soft btn-sm" id="switchBtn" onclick="switchView('customer')"></button></div>
  </header>
  <main id="adminView"><div id="adminContentArea"></div></main>
  <main id="customerView" class="hidden"></main>
</div>

<div class="dock" id="dock"><nav aria-label="Navigasi utama">
  <button class="tab" data-m="dashboard" onclick="loadAdminMenu('dashboard')"></button>
  <button class="tab" data-m="booking" onclick="loadAdminMenu('booking')"></button>
  <button class="tab" data-m="transaksi" onclick="loadAdminMenu('transaksi')"></button>
  <button class="tab" data-m="more" onclick="toggleSheet(true)"></button>
</nav></div>

<div class="scrim" id="scrim" onclick="toggleSheet(false)"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Semua menu"><div class="grab"></div><div class="grid" id="sheetGrid"></div></div>

<div class="modal" id="editModal" onclick="if(event.target===this)closeForm()"><div class="box" style="max-height:88vh;overflow-y:auto">
  <h3 id="edTitle" style="font-size:22px"></h3>
  <div id="edFields"></div>
  <div id="edBtns" style="display:flex;gap:10px;margin-top:22px"></div>
</div></div>
<div class="modal" id="loginModal" onclick="if(event.target===this)closeLogin()"><div class="box">
  <h3 style="font-size:22px;margin-bottom:4px">Masuk panel admin</h3>
  <p style="color:var(--muted)">Khusus pemilik studio.</p>
  <div class="field"><label for="admEmail">Email</label><input id="admEmail" type="email" autocomplete="username"></div>
  <div class="field"><label for="admPass">Kata sandi</label><input id="admPass" type="password" autocomplete="current-password"></div>
  <div style="display:flex;gap:10px;margin-top:22px"><button class="btn btn-soft" onclick="closeLogin()">Batal</button><button class="btn btn-gloss" style="flex:1" onclick="adminLogin()">Masuk</button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const CFG=window.AQ_CONFIG||{};
const SUPABASE_URL=CFG.SUPABASE_URL||'',SUPABASE_ANON_KEY=CFG.SUPABASE_ANON_KEY||'';
const DEMO=!SUPABASE_URL||!SUPABASE_ANON_KEY||SUPABASE_URL.includes('ISI_')||SUPABASE_ANON_KEY.includes('ISI_');
let sb;

const $=id=>document.getElementById(id);
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtDate=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
const normWa=v=>{let n=String(v).replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n};
const waOk=n=>/^62\d{8,13}$/.test(n);

function demoClient(){
 const K='aq_demo',uid=()=>'d'+Math.random().toString(36).slice(2,10),iso=()=>new Date().toISOString();
 const seed=()=>{const t=today(),mk=(n,wa,sv,pr,ar,jam,stt)=>{const id=uid(),o='AQ-DEMO'+uid().slice(1,5).toUpperCase();return [{id,order_id:o,customer_name:n,customer_wa:wa,service_name:sv,price:pr,artist_name:ar,booking_date:t,booking_time:jam,status:stt,created_at:iso()},{id:uid(),booking_id:id,order_id:o,gross_amount:pr,status:stt==='Menunggu'?'pending':'settlement',method:stt==='Menunggu'?null:'qris',created_at:iso()}]};
  const r=[mk('Siska Melati','6281234567890','Gel Polish Classic',120000,'Dewi (Senior Artist)','10:00','Terkonfirmasi'),mk('Anindya Putri','6285711223344','Nail Art 3D Custom',250000,'Rina (Master Stylist)','13:30','Terkonfirmasi'),mk('Laras Wulan','6281399887766','Manicure & Pedicure Spa',180000,'Siti (Junior Artist)','16:00','Menunggu')];
  return {services:[{id:uid(),name:'Gel Polish Classic',price:120000,duration:45,active:true},{id:uid(),name:'Nail Art 3D Custom',price:250000,duration:90,active:true},{id:uid(),name:'Manicure & Pedicure Spa',price:180000,duration:60,active:true}],
   artists:[{id:uid(),name:'Dewi',role:'Senior Artist',active:true},{id:uid(),name:'Siti',role:'Junior Artist',active:true},{id:uid(),name:'Rina',role:'Master Stylist',active:true}],
   stock:[{id:uid(),name:'Gel polish merah & pink',qty:15,min_qty:5,unit:'botol'},{id:uid(),name:'Kuku palsu press-on',qty:8,min_qty:3,unit:'box'},{id:uid(),name:'Aksesori 3D pearl',qty:3,min_qty:5,unit:'pack'}],
   bookings:r.map(x=>x[0]),payments:r.map(x=>x[1])}};
 let D=ls.get(K)||seed();const save=()=>ls.set(K,D);
 class Q{
  constructor(t){this.t=t;this.op='select';this.f=[];this.ord=null}
  select(){return this}
  order(c,o){this.ord=[c,!(o&&o.ascending===false)];return this}
  eq(c,v){this.f.push([c,v]);return this}
  update(r){this.op='update';this.r=r;return this}
  insert(r){this.op='insert';this.r=r;return this}
  delete(){this.op='delete';return this}
  then(ok,bad){return Promise.resolve(this.run()).then(ok,bad)}
  run(){
   const rows=D[this.t],m=r=>this.f.every(([c,v])=>r[c]===v);
   if(this.op==='insert'){rows.push({id:uid(),created_at:iso(),active:true,...this.r});save();return {data:null,error:null}}
   if(this.op==='update'){rows.filter(m).forEach(r=>Object.assign(r,this.r));save();return {data:null,error:null}}
   if(this.op==='delete'){D[this.t]=rows.filter(r=>!m(r));save();return {data:null,error:null}}
   let out=rows.filter(m).map(r=>({...r}));
   if(this.ord){const [c,asc]=this.ord;out.sort((a,b)=>(a[c]>b[c]?1:a[c]<b[c]?-1:0)*(asc?1:-1))}
   if(this.t==='payments')out=out.map(p=>({...p,bookings:D.bookings.find(b=>b.id===p.booking_id)||{}}));
   return {data:out,error:null};
  }
 }
 return {
  auth:{getSession:async()=>({data:{session:{demo:true}}}),signInWithPassword:async()=>({data:{session:{demo:true}},error:null}),signOut:async()=>({})},
  from:t=>new Q(t),
  rpc:async(fn,a)=>{
   if(fn==='taken_slots')return {data:D.bookings.filter(b=>b.booking_date===a.d&&b.status!=='Batal').map(b=>({artist_name:b.artist_name,booking_time:b.booking_time}))};
   const dg=v=>String(v).replace(/\D/g,'');
   return {data:D.bookings.filter(b=>dg(b.customer_wa)===dg(a.p_wa)&&b.customer_name.toLowerCase()===a.p_name.toLowerCase()).map(b=>({...b,snap_token:null})).reverse()};
  },
  channel:()=>({on(){return this},subscribe(){}}),removeChannel(){},
  _pay(o){const id=uid(),oid='AQ-DEMO'+uid().slice(1,5).toUpperCase();

async function submitBooking(e){
 e.preventDefault();
 const who=validId();if(!who)return;
 const date=curDate(),sv=svcA()[sel.s],ar=artA()[sel.a],btn=e.submitter||e.target.querySelector('[type=submit]');
 if(sel.t<0||taken(sel.a,date,sel.t)){toast('Jam itu sudah terisi, pilih jam lain',true);renderCustomer();return}
 if(DEMO){const oid=sb._pay({name:who.name,wa:who.wa,service:sv,artist:ar,date,time:TIMES[sel.t]});await refresh();showResult('ok',{order_id:oid,service:sv.n,artist:ar.n,date,time:TIMES[sel.t],price:sv.p,exp:Date.now()});return}
 btn.disabled=true;btn.textContent='Memproses...';
 try{
  const r=await fetch(SUPABASE_URL+'/functions/v1/create-payment',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({name:who.name,wa:who.wa,service:sv.n,artist:ar.n+' ('+ar.r+')',date,time:TIMES[sel.t]})});
  const d=await r.json();
  if(r.status===409){toast('Jam itu baru saja dipesan orang lain',true);await loadSlots(date);renderCustomer();return}
  if(!r.ok)throw new Error(d.error||'gagal');
  payNow({order_id:d.order_id,token:d.token,service:sv.n,artist:ar.n,date,time:TIMES[sel.t],price:sv.p,exp:Date.now()+30*60000});
 }catch(err){toast('Gagal memproses: '+err.message,true);btn.disabled=false;btn.textContent='Bayar & konfirmasi'}
}

 toast('Status diubah: '+x);refresh();
}
function filtered(){const q=bf.q.trim().toLowerCase();return db.filter(b=>(!q||(b.nama+' '+b.layanan+' '+b.artist+' '+b.wa).toLowerCase().includes(q))&&(bf.f==='Semua'||(bf.f==='Hari ini'?b.tanggal===today():st(b)===bf.f)))}
function drawBookings(){const l=filtered();$('bkList').innerHTML=l.length?listRows(l.map((b,i)=>bookingRow(b,i,true))):empty('Tidak ada booking',db.length?'Coba ubah pencarian atau filter.':'Booking dari pelanggan akan muncul di sini.')}

function openForm(title,fields,onSave,onDel){
 $('edTitle').textContent=title;
 $('edFields').innerHTML=fields.map(f=>`<div class="field"><label for="ed_${f.k}">${f.l}</label>${f.t==='select'?`<select id="ed_${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${String(o[0])===String(f.v)?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="ed_${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t==='number'?'inputmode="numeric" min="0"':''}>`}</div>`).join('');
 $('edBtns').innerHTML=(onDel?`<button class="btn btn-soft" id="edDel" aria-label="Hapus">${ic('trash')}</button>`:'')+`<button class="btn btn-soft" onclick="closeForm()">Batal</button><button class="btn btn-gloss" style="flex:1" id="edSave">Simpan</button>`;
 $('edSave').onclick=async()=>{const v={};fields.forEach(f=>v[f.k]=$('ed_'+f.k).value.trim());const err=await onSave(v);if(err){toast(err,true);return}closeForm()};
 if(onDel)$('edDel').onclick=async()=>{if(!confirm('Hapus data ini?'))return;const err=await onDel();if(err){toast(err,true);return}closeForm()};$('editModal').classList.add('on');
}
function closeForm(){$('editModal').classList.remove('on');if(adminReady&&!$('adminView').classList.contains('hidden'))loadAdminMenu(cur,true)}
async function saveQ(q){const {error}=await q;if(error)return error.code==='23505'?'Nama itu sudah dipakai':'Gagal menyimpan. Coba lagi';await refresh();toast('Tersimpan');return ''}
function editService(id){
 const s=SERVICES.find(x=>x.id===id)||{n:'',p:'',d:60,active:true};
 openForm(id?'Ubah layanan':'Tambah layanan',[{k:'n',l:'Nama layanan',v:s.n},{k:'p',l:'Harga (Rp)',t:'number',v:s.p},{k:'d',l:'Durasi (menit)',t:'number',v:s.d},{k:'a',l:'Status',t:'select',o:[['1','Aktif'],['0','Nonaktif']],v:s.active===false?'0':'1'}],
  v=>{const p=+v.p,d=+v.d;if(v.n.length<2||!(p>0)||!(d>0&&d<=200))return 'Periksa nama, harga, dan durasi (maks. 200 menit)';const row={name:v.n,price:p,duration:d,active:v.a==='1'};return saveQ(id?sb.from('services').update(row).eq('id',id):sb.from('services').insert(row))},
  id?()=>saveQ(sb.from('services').delete().eq('id',id)):null);
}
function editArtist(id){
 const a=ARTISTS.find(x=>x.id===id)||{n:'',r:'Nail Artist',active:true};
 openForm(id?'Ubah staf':'Tambah staf',[{k:'n',l:'Nama',v:a.n},{k:'r',l:'Jabatan',v:a.r},{k:'a',l:'Status',t:'select',o:[['1','Aktif'],['0','Nonaktif']],v:a.active===false?'0':'1'}],
  v=>{if(v.n.length<2||!v.r)return 'Isi nama dan jabatan';const row={name:v.n,role:v.r,active:v.a==='1'};return saveQ(id?sb.from('artists').update(row).eq('id',id):sb.from('artists').insert(row))},
  id?()=>saveQ(sb.from('artists').delete().eq('id',id)):null);
}
function editStock(id){
 const s=STOCK.find(x=>x.id===id)||{name:'',qty:0,min_qty:3,unit:'pcs'};
 openForm(id?'Ubah stok':'Tambah bahan',[{k:'n',l:'Nama bahan',v:s.name},{k:'q',l:'Jumlah',t:'number',v:s.qty},{k:'m',l:'Batas menipis',t:'number',v:s.min_qty},{k:'u',l:'Satuan',v:s.unit}],
  v=>{if(v.n.length<2||v.q===''||!v.u)return 'Isi nama, jumlah, dan satuan';const row={name:v.n,qty:Math.max(0,+v.q),min_qty:Math.max(0,+v.m||0),unit:v.u};return saveQ(id?sb.from('stock').update(row).eq('id',id):sb.from('stock').insert(row))},
  id?()=>saveQ(sb.from('stock').delete().eq('id',id)):null);
}
async function adjStock(id,d){const s=STOCK.find(x=>x.id===id);if(!s)return;s.qty=Math.max(0,s.qty+d);loadAdminMenu('stok',true);const {error}=await sb.from('stock').update({qty:s.qty}).eq('id',id);if(error){toast('Gagal mengubah stok',true);refresh()}}
const addBtn=(fn,label)=>`<button class="btn btn-gloss btn-block" style="margin-bottom:14px" onclick="${fn}()">${ic('plus')}${label}</button>`;
const editBtn=fn=>`<button class="ibtn" aria-label="Ubah" onclick="${fn}">${ic('edit')}</button>`;

function loadAdminMenu(m,keep){
 const area=$('adminContentArea');
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.m===m||(b.dataset.m==='more'&&!['dashboard','booking','transaksi'].includes(m))));
 area.classList.toggle('still',!!keep);
 cur=m;
 if(!adminReady){area.innerHTML='<div class="skel" style="height:150px"></div><div class="skel" style="height:84px;margin-top:12px"></div>';return}
 let h='';
 if(m==='dashboard'){
  const td=active().filter(b=>b.tanggal===today()).sort((a,b)=>a.jam.localeCompare(b.jam)),low=STOCK.filter(s=>s.qty<=s.min_qty);
  h=`<section class="hero"><div class="drop"></div><p class="l">Pendapatan total</p><div class="big disp" id="revN">${rp(keep?rev():0)}</div><p class="sub">dari <span id="bkN">${keep?active().length:0}</span> booking aktif</p></section>
  <div class="stats"><div class="card stat"><span>${ic('cal')}Jadwal hari ini</span><b>${td.length}</b></div><div class="card stat"><span>${ic('clock')}Menunggu bayar</span><b>${db.filter(b=>st(b)==='Menunggu').length}</b></div></div>
  ${low.length?`<div class="card" onclick="loadAdminMenu('stok')" style="margin-top:12px;cursor:pointer;display:flex;gap:12px;align-items:center;border-color:var(--amber)"><span style="color:var(--amber)">${ic('box')}</span><div><b>${low.length} bahan hampir habis</b><br><small style="color:var(--muted)">Ketuk untuk melihat stok</small></div></div>`:''}
  <div class="sec"><h2>Jadwal hari ini</h2><a onclick="loadAdminMenu('booking')">Lihat semua</a></div>`+
  (td.length?listRows(td.map((b,i)=>bookingRow(b,i,false))):empty('Tidak ada jadwal hari ini','Booking baru akan muncul di sini secara otomatis.',true));
 }else if(m==='booking'){
  h=`<h1 class="pagetitle">Booking</h1><div class="search">${ic('search')}<input id="bkQ" type="search" placeholder="Cari nama, layanan, atau artist" aria-label="Cari booking" value="${esc(bf.q)}" oninput="bf.q=this.value;drawBookings()"></div>
  <div class="chips scroll" style="margin:12px 0 14px" role="group" aria-label="Filter">${FILTERS.map(f=>`<button class="chip ${bf.f===f?'on':''}" aria-pressed="${bf.f===f}" onclick="bf.f='${f}';loadAdminMenu('booking',true)">${f}</button>`).join('')}</div><div id="bkList"></div>`;
 }else if(m==='transaksi'){
  const PB={settlement:'',capture:'',pending:'warn',expire:'bad',cancel:'bad',deny:'bad'},PL={settlement:'Lunas',capture:'Lunas',pending:'Menunggu',expire:'Kedaluwarsa',cancel:'Dibatalkan',deny:'Ditolak'};
  h=`<h1 class="pagetitle">Transaksi</h1>`+(pays.length?listRows(pays.map((p,i)=>`<div class="row" style="animation-delay:${Math.min(i,8)*40}ms"><div class="ava" style="background:var(--mint-s);color:var(--mint)">${ic('card')}</div><div class="t"><b>${esc(p.bookings?.customer_name||'-')} · ${esc(p.bookings?.service_name||'')}</b><small>${esc(p.order_id)} · ${esc((p.method||'belum dipilih').replace(/_/g,' '))}</small></div><div style="text-align:right"><div class="price">${rp(p.gross_amount)}</div><span class="badge ${PB[p.status]??'warn'}">${PL[p.status]||esc(p.status)}</span></div></div>`)):empty('Belum ada transaksi','Setiap pembayaran dari Midtrans tercatat otomatis.'));
 }else if(m==='keuangan'||m==='laporan'){
  h=`<h1 class="pagetitle">${m==='laporan'?'Laporan':'Keuangan'}</h1><div class="card"><div class="kv"><span>Total pendapatan</span><b style="color:var(--mint)">${rp(rev())}</b></div><div class="kv"><span>Total pengeluaran</span><b style="color:var(--gloss)">Rp 0</b></div><div class="kv total"><span>Laba bersih</span><span>${rp(rev())}</span></div></div>`;
 }else if(m==='customer'){
  const names=[...new Set(db.map(b=>b.nama))];
  h=`<h1 class="pagetitle">Pelanggan (${names.length})</h1>`+(names.length?listRows(names.map((n,i)=>`<div class="row" style="animation-delay:${Math.min(i,8)*40}ms"><div class="ava">${esc(n.charAt(0).toUpperCase())}</div><div class="t"><b>${esc(n)}</b><small>${db.filter(b=>b.nama===n).length} booking</small></div></div>`)):empty('Belum ada pelanggan','Pelanggan muncul setelah melakukan booking.'));
 }else if(m==='layanan'){
  h=`<h1 class="pagetitle">Layanan</h1>${addBtn('editService','Tambah layanan')}`+(SERVICES.length?listRows(SERVICES.map((s,i)=>`<div class="row" style="animation-delay:${i*40}ms${s.active?'':';opacity:.55'}"><div class="ava">${ic('brush')}</div><div class="t"><b>${esc(s.n)}</b><small>${s.d} menit${s.active?'':' · Nonaktif'}</small></div><div class="price">${rp(s.p)}</div>${editBtn(`editService('${s.id}')`)}</div>`)):empty('Belum ada layanan','Tambahkan layanan pertama kamu.'));
 }else if(m==='staff'){
  h=`<h1 class="pagetitle">Staf</h1>${addBtn('editArtist','Tambah staf')}`+(ARTISTS.length?listRows(ARTISTS.map((a,i)=>`<div class="row" style="animation-delay:${i*40}ms${a.active?'':';opacity:.55'}"><div class="ava">${esc(a.n[0]||'?')}</div><div class="t"><b>${esc(a.n)}</b><small>${esc(a.r)}${a.active?'':' · Nonaktif'}</small></div>${editBtn(`editArtist('${a.id}')`)}</div>`)):empty('Belum ada staf','Tambahkan nail artist pertama kamu.'));
 }else if(m==='stok'){
  h=`<h1 class="pagetitle">Stok bahan</h1>${addBtn('editStock','Tambah bahan')}`+(STOCK.length?listRows(STOCK.map((s,i)=>{const lo=s.qty<=s.min_qty;return `<div class="row wr" style="animation-delay:${i*40}ms"><div class="ava" style="background:${lo?'var(--amber-s)':'var(--mint-s)'};color:${lo?'var(--amber)':'var(--mint)'}">${ic('box')}</div><div class="t"><b>${esc(s.name)}</b><small>${s.qty} ${esc(s.unit)}</small></div><span class="badge ${lo?'warn':''}">${lo?'Menipis':'Aman'}</span><div class="acts"><button class="btn btn-soft btn-sm" aria-label="Kurangi" onclick="adjStock('${s.id}',-1)">${ic('minus')}</button><button class="btn btn-soft btn-sm" aria-label="Tambah" onclick="adjStock('${s.id}',1)">${ic('plus')}</button><button class="btn btn-soft btn-sm" onclick="editStock('${s.id}')">${ic('edit')}Ubah</button></div></div>`})):empty('Belum ada stok','Tambahkan bahan pertama kamu.'));
 }
 area.innerHTML=`<div class="${keep?'':'view'}">${h}</div>`;
 if(m==='dashboard'&&!keep){countUp($('revN'),rev(),rp);countUp($('bkN'),active().length,String)}
 if(m==='booking')drawBookings();
 if(!keep)window.scrollTo(0,0);
}

function openLogin(){$('loginModal').classList.add('on')}
function closeLogin(){$('loginModal').classList.remove('on')}
async function adminLogin(){
 const {data,error}=await sb.auth.signInWithPassword({email:$('admEmail').value.trim(),password:$('admPass').value});
 if(error){toast('Email atau kata sandi salah',true);return}
 session=data.session;closeLogin();$('admPass').value='';await startAdmin();switchView('admin');
}
async function adminLogout(){await sb.auth.signOut();session=null;stopAdmin();switchView('customer');toast('Sudah keluar')}
async function startAdmin(){
 await refresh();
 chan=sb.channel('aq-live');
 ['bookings','payments','services','artists','stock'].forEach(t=>chan.on('postgres_changes',{event:'*',schema:'public',table:t},refresh));
 chan.subscribe();
}
function stopAdmin(){if(chan)sb.removeChannel(chan);chan=null;db=[];pays=[];STOCK=[];adminReady=false}
async function refresh(){
 const R=await Promise.all([sb.from('bookings').select('*').order('created_at',{ascending:false}),sb.from('payments').select('*, bookings(customer_name,service_name)').order('created_at',{ascending:false}),sb.from('services').select('*').order('price'),sb.from('artists').select('*').order('name'),sb.from('stock').select('*').order('name')]);
 if(R.some(r=>r.error)){toast('Gagal memuat data. Periksa koneksi',true);return}
 db=R[0].data.map(r=>({id:r.id,nama:r.customer_name,wa:r.customer_wa,layanan:r.service_name,harga:r.price,artist:r.artist_name,tanggal:r.booking_date,jam:r.booking_time,status:r.status}));
 pays=R[1].data;SERVICES=R[2].data.map(mapSvc);ARTISTS=R[3].data.map(mapArt);STOCK=R[4].data;adminReady=true;
 if($('adminView').classList.contains('hidden'))return;
 if(cur==='booking'&&document.activeElement&&document.activeElement.id==='bkQ')drawBookings();
 else if(!$('editModal').classList.contains('on'))loadAdminMenu(cur,true);
}
async function initApp(){
 if(DEMO)document.querySelector('.top').insertAdjacentHTML('afterend','<div class="demo">Mode demo: data hanya tersimpan di perangkat ini. Isi kunci di <code>config.js</code> untuk mode sungguhan.</div>');
 const [r]=await Promise.all([sb.auth.getSession(),loadCatalog()]);
 session=r.data.session;
 if(session)await startAdmin();
 switchView(session?'admin':'customer');
}

let th=null;try{th=localStorage.getItem('aq_theme')}catch(e){}
applyTheme(th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
buildChrome();initApp();
</script>
</body>
</html>
